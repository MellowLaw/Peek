name: Release Peek

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed Windows NSIS release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Peek v__VERSION__"
          releaseBody: |
            ### What's New in Peek v__VERSION__
            - Automatically hides the notch when a fullscreen game or app is active (`Hide in fullscreen`, on by default in **Settings → Notch → Behavior**) with OS-level window hiding so zero pixels or hit targets remain
            - Move your mouse up to the top-center edge (`100ms` dwell) to reveal Peek cleanly on top of fullscreen apps and auto-hide straight back when you leave

            ### How to Download & Install

            1. Under **Assets** below, download **`Peek___VERSION___x64-setup.exe`** (Windows 10 / 11 x64 installer).
               *You can ignore `latest.json`, `.sig`, and `Source code` — those are only used by Peek's built-in updater and developers.*
            2. Double-click **`Peek___VERSION___x64-setup.exe`** to install Peek (accept Terms & Conditions on setup).
            3. If Windows Defender SmartScreen shows *"Windows protected your PC"* on first install/launch, click **More info** → **Run anyway**.

            ### Automatic Updates
            Future updates are cryptographically signed and pop up with full patch notes right below the notch (**Update now** / **Later** / **Skip**, or check manually in **Settings → Notch → Updates**).
          releaseDraft: false
          prerelease: false
          args: --ci
