name: Release Peek

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed Windows NSIS release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Peek v__VERSION__"
          releaseBody: |
            Windows 10 / 11 (x64) NSIS installer and signed auto-updater release.

            ### First launch note (Windows SmartScreen)
            Peek is currently unsigned by a paid Windows Authenticode certificate, so Windows Defender SmartScreen may show *"Windows protected your PC"* on first install/launch. Click **More info** -> **Run anyway**.

            Future updates are cryptographically signed and delivered automatically inside Peek (**Update now** / **Later**).
          releaseDraft: false
          prerelease: false
          args: --ci
